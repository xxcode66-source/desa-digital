openapi: 3.0.3
info:
  title: API Aplikasi Desa Digital
  version: 0.2.0-fase1
  description: |
    Spesifikasi API Fase 0 (fondasi) + Fase 1 (Auth & Verifikasi): health check, login,
    registrasi warga dengan NIK + consent (tanpa OTP/SMS pihak ketiga), profil, logout/logout-all.
    Verifikasi identitas dilakukan operator di panel Filament (status pending -> verified/rejected).
    Endpoint fitur bisnis (surat, PBB, UMKM, pengaduan) menyusul pada fasenya masing-masing
    sesuai PEMBANGUNAN.md §8 (aturan satu fase per sesi).
    Auth: header `Authorization: Bearer <token>` (Sanctum personal access token).
servers:
  - url: /api
    description: Basis path API Laravel

tags:
  - name: System
  - name: Auth

paths:
  /health:
    get:
      tags: [System]
      summary: Cek kesiapan layanan
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  app: { type: string, example: "Desa Digital" }
                  status: { type: string, example: "ok" }

  /login:
    post:
      tags: [Auth]
      summary: Login (nomor HP + password) -> token Sanctum
      description: Rate-limited 10 request/menit.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, password]
              properties:
                phone: { type: string, example: "08123456789" }
                password: { type: string, format: password }
      responses:
        '200':
          description: Login berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string, description: Personal access token Sanctum }
                  user: { $ref: '#/components/schemas/User' }
        '401':
          description: Nomor HP / password salah
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '422':
          description: Validasi input gagal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
        '429':
          description: Terlalu banyak percobaan (throttle)

  /register:
    post:
      tags: [Auth]
      summary: Daftar akun warga baru (NIK + consent)
      description: |
        Rate-limited. Memvalidasi NIK (struktur) + consent (UU PDP), membuat user dengan
        status pending + role `warga`, lalu memberi token agar warga bisa login & memantau
        status verifikasinya. Nomor HP TIDAK diverifikasi via OTP (tanpa gateway berbayar);
        verifikasi identitas dilakukan operator di panel.
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [village_id, nik, name, phone, password, password_confirmation, consent]
              properties:
                village_id: { type: integer }
                nik: { type: string, pattern: '^[0-9]{16}$', description: "16 digit, divalidasi strukturnya (NikValid)." }
                name: { type: string }
                phone: { type: string }
                password: { type: string, format: password, minLength: 8 }
                password_confirmation: { type: string, format: password }
                rt: { type: string, nullable: true }
                rw: { type: string, nullable: true }
                consent: { type: boolean, example: true, description: "Persetujuan penggunaan data (UU PDP)." }
      responses:
        '201':
          description: Pendaftaran berhasil (menunggu verifikasi operator)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  token: { type: string }
                  user: { $ref: '#/components/schemas/User' }
        '422':
          description: Validasi gagal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }

  /me:
    get:
      tags: [Auth]
      summary: Profil pengguna yang sedang login (beserta roles)
      operationId: me
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Data profil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401':
          description: Tidak terautentikasi

  /logout:
    post:
      tags: [Auth]
      summary: Cabut token aktif
      operationId: logout
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Berhasil keluar
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '401':
          description: Tidak terautentikasi

  /logout-all:
    post:
      tags: [Auth]
      summary: Cabut SEMUA token perangkat (logout-all)
      operationId: logoutAll
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Semua sesi diakhiri
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '401':
          description: Tidak terautentikasi

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum

  schemas:
    User:
      type: object
      properties:
        id: { type: integer }
        village_id: { type: integer, nullable: true, description: "Semua data terikat desa (prinsip multi-desa)." }
        name: { type: string }
        phone: { type: string }
        email: { type: string, format: email, nullable: true, description: "Untuk akun perangkat desa/operator." }
        status: { type: string, enum: [pending, verified, rejected] }
        rt: { type: string, nullable: true }
        rw: { type: string, nullable: true }
        consent_given_at: { type: string, format: date-time, nullable: true }
        terms_version: { type: string, nullable: true }
        roles:
          type: array
          items: { $ref: '#/components/schemas/Role' }
    Role:
      type: object
      properties:
        name: { type: string, example: "admin" }
        label: { type: string, example: "Administrator Desa" }
    Message:
      type: object
      properties:
        message: { type: string }
    ValidationError:
      type: object
      properties:
        message: { type: string }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
