openapi: 3.0.3
info:
  title: API Aplikasi Desa Digital
  version: 0.5.0-fase4
  description: |
    Spesifikasi API Fase 0 (fondasi) + Fase 1 (Auth & Verifikasi) + Fase 2 (Surat) +
    Fase 3 (Pengaduan) + Fase 4 (PBB): health check, login, registrasi warga dengan NIK + consent (tanpa
    OTP/SMS pihak ketiga), profil, logout/logout-all, layanan surat dinamis (jenis surat
    berbasis form_schema, pengajuan multipart + lampiran, lacak status, perbaikan per-field),
    verifikasi keaslian surat publik via QR, pengaduan warga (kategori baku, foto bukti +
    lokasi opsional, kirim anonim, status diterima/diproses/selesai/ditolak, balasan &
    kronologi, papan publik yang menyamarkan pelapor anonim), dan PBB/npd (cek NOP publik
    dengan nama wajib pajak disamarkan + rate limit, klaim kepemilikan dengan foto bukti,
    "NOP saya" + tunggakan, dan alur setoran RT/kolektor yang dinilai bendahara). Verifikasi
    klaim, impor database PBB, serta ACC setoran (termasuk ACC sebagian per item) dilakukan
    staff lewat panel Filament, bukan via API warga. PENTING: tidak ada pembayaran di dalam
    aplikasi — status `lunas` adalah verifikasi internal desa, bukan bukti pelunasan resmi.
    Endpoint fitur bisnis lainnya (UMKM) menyusul pada fasenya sesuai PEMBANGUNAN.md §8
    (aturan satu fase per sesi).
    Auth: header `Authorization: Bearer <token>` (Sanctum personal access token).
servers:
  - url: /api
    description: Basis path API Laravel

tags:
  - name: System
  - name: Auth
  - name: Letters
  - name: Complaints
  - name: Pbb
  - name: Public

paths:
  /health:
    get:
      tags: [System]
      summary: Cek kesiapan layanan
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  app: { type: string, example: "Desa Digital" }
                  status: { type: string, example: "ok" }

  /login:
    post:
      tags: [Auth]
      summary: Login (nomor HP + password) -> token Sanctum
      description: Rate-limited 10 request/menit.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, password]
              properties:
                phone: { type: string, example: "08123456789" }
                password: { type: string, format: password }
      responses:
        '200':
          description: Login berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string, description: Personal access token Sanctum }
                  user: { $ref: '#/components/schemas/User' }
        '401':
          description: Nomor HP / password salah
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '422':
          description: Validasi input gagal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
        '429':
          description: Terlalu banyak percobaan (throttle)

  /register:
    post:
      tags: [Auth]
      summary: Daftar akun warga baru (NIK + consent)
      description: |
        Rate-limited. Memvalidasi NIK (struktur) + consent (UU PDP), membuat user dengan
        status pending + role `warga`, lalu memberi token agar warga bisa login & memantau
        status verifikasinya. Nomor HP TIDAK diverifikasi via OTP (tanpa gateway berbayar);
        verifikasi identitas dilakukan operator di panel.
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [village_id, nik, name, phone, password, password_confirmation, consent]
              properties:
                village_id: { type: integer }
                nik: { type: string, pattern: '^[0-9]{16}$', description: "16 digit, divalidasi strukturnya (NikValid)." }
                name: { type: string }
                phone: { type: string }
                password: { type: string, format: password, minLength: 8 }
                password_confirmation: { type: string, format: password }
                rt: { type: string, nullable: true }
                rw: { type: string, nullable: true }
                consent: { type: boolean, example: true, description: "Persetujuan penggunaan data (UU PDP)." }
      responses:
        '201':
          description: Pendaftaran berhasil (menunggu verifikasi operator)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  token: { type: string }
                  user: { $ref: '#/components/schemas/User' }
        '422':
          description: Validasi gagal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }

  /me:
    get:
      tags: [Auth]
      summary: Profil pengguna yang sedang login (beserta roles)
      operationId: me
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Data profil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401':
          description: Tidak terautentikasi

  /logout:
    post:
      tags: [Auth]
      summary: Cabut token aktif
      operationId: logout
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Berhasil keluar
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '401':
          description: Tidak terautentikasi

  /logout-all:
    post:
      tags: [Auth]
      summary: Cabut SEMUA token perangkat (logout-all)
      operationId: logoutAll
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Semua sesi diakhiri
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '401':
          description: Tidak terautentikasi

  /verify-letter/{token}:
    get:
      tags: [Public]
      summary: Verifikasi keaslian surat (hasil scan QR pada surat selesai)
      description: |
        Tanpa login; di-rate-limit untuk mencegah scraping (config `desa.throttle.letter_verify`).
        Hanya surat berstatus `selesai` dengan `public_token` yang dikenali.
      operationId: verifyLetter
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Surat sah
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid: { type: boolean, example: true }
                  number: { type: string, example: "470/001/DS/10/2026" }
                  type: { type: string, example: "Surat Keterangan Usaha" }
                  issued_for: { type: string }
                  issued_at: { type: string, format: date }
                  village: { type: string }
        '404':
          description: Kode tidak dikenal / surat belum selesai
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid: { type: boolean, example: false }
                  message: { type: string }
        '429':
          description: Terlalu banyak permintaan (throttle)

  /letters/types:
    get:
      tags: [Letters]
      summary: Daftar jenis surat aktif (bawaan + milik desa warga)
      description: |
        Formulir dirender dinamis di aplikasi dari `form_schema_json` — tidak ada
        hardcode per jenis surat (PEMBANGUNAN.md 4.2).
      operationId: letterTypes
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Daftar jenis surat
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/LetterType' }
        '401':
          description: Tidak terautentikasi

  /letters:
    get:
      tags: [Letters]
      summary: Daftar surat milik warga (terbaru dulu, paginasi 20)
      operationId: myLetters
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Daftar ringkas surat
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/LetterSummary' }
                  meta:
                    type: object
                    properties:
                      total: { type: integer }
                      page: { type: integer }
        '401':
          description: Tidak terautentikasi
    post:
      tags: [Letters]
      summary: Ajukan surat baru (multipart)
      description: |
        Hanya warga berstatus `verified` (Policy `Letter@create`, selain itu 403).
        Rate-limited (config `desa.throttle.letter_submit`). Field formulir dikirim
        sebagai `data[<key>]` sesuai `form_schema_json` jenis surat; minimal satu
        lampiran wajib diunggah (foto KTP/KK dsb., maks 5, MIME & ukuran dibatasi
        config `desa.letters`). Jenis dengan `needs_rt` masuk antrean RT;
        tanpa pengantar RT langsung ke operator.
      operationId: submitLetter
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [letter_type_id, attachments]
              properties:
                letter_type_id: { type: integer }
                data:
                  type: object
                  additionalProperties: { type: string }
                  description: "Kirim sebagai field data[nama_key]=nilai."
                attachments:
                  type: array
                  minItems: 1
                  maxItems: 5
                  items: { type: string, format: binary }
                  description: "Kirim sebagai field berulang attachments[]."
      responses:
        '201':
          description: Surat berhasil diajukan
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data: { $ref: '#/components/schemas/LetterDetail' }
        '403':
          description: Akun belum terverifikasi / bukan warga
        '422':
          description: Validasi isian atau lampiran gagal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
        '429':
          description: Terlalu sering mengirim (throttle)

  /letters/{letter}:
    get:
      tags: [Letters]
      summary: Detail satu surat + riwayat status + lampiran
      operationId: letterDetail
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/LetterId' }]
      responses:
        '200':
          description: Data lengkap surat
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/LetterDetail' }
        '403':
          description: Bukan pemiliknya / lintas desa
        '404':
          description: Surat tidak ditemukan
    put:
      tags: [Letters]
      summary: Perbaiki & kirim ulang surat berstatus perlu_perbaikan
      description: |
        Hanya saat status `perlu_perbaikan` (Policy `Letter@update`). Field yang ditandai
        petugas (`flagged_fields`) dirender merah di wizard agar warga tahu persis
        bagian yang harus diperbaiki. Lampiran baru bersifat opsional (sometimes).
      operationId: repairLetter
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/LetterId' }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                data:
                  type: object
                  additionalProperties: { type: string }
                attachments:
                  type: array
                  maxItems: 5
                  items: { type: string, format: binary }
      responses:
        '200':
          description: Perbaikan terkirim
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data: { $ref: '#/components/schemas/LetterDetail' }
        '403':
          description: Bukan pemiliknya / status tidak boleh diubah
        '422':
          description: Validasi isian gagal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }

  /letters/{letter}/attachments/{attachment}:
    get:
      tags: [Letters]
      summary: Unduh lampiran surat (disk privat)
      description: Hanya untuk pihak yang boleh melihat surat (pemilik / staff desa terkait).
      operationId: downloadLetterAttachment
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/LetterId' }
        - name: attachment
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Isi berkas lampiran
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '403':
          description: Tidak diizinkan melihat lampiran ini
        '404':
          description: Lampiran tidak ditemukan

  /complaints:
    get:
      tags: [Complaints, Public]
      summary: Papan publik pengaduan (identitas pelapor anonim disamarkan)
      description: |
        Tanpa login; di-rate-limit (config `desa.throttle.complaint_browse`). Menampilkan
        laporan terbaru (paginasi 20) dengan `reporter_name` = "Warga anonim" untuk laporan
        yang ditandai anonim, dan nama pelapor untuk laporan biasa. Filter `village_id` opsional.
      operationId: complaintWall
      parameters:
        - name: village_id
          in: query
          required: false
          schema: { type: integer }
      responses:
        '200':
          description: Daftar pengaduan untuk publik
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ComplaintWallItem' }
                  meta:
                    type: object
                    properties:
                      total: { type: integer }
                      page: { type: integer }
        '429':
          description: Terlalu banyak permintaan (throttle)
    post:
      tags: [Complaints]
      summary: "Ajukan pengaduan baru (multipart: isian + photos[])"
      description: |
        Hanya warga berstatus `verified` (Policy `Complaint@create`, selain itu 403).
        Rate-limited (config `desa.throttle.complaint_submit`). Kategori harus salah satu
        kode dari `/complaints/categories`. Foto bukti opsional (maks `desa.complaints.max_photos`,
        MIME & ukuran dibatasi config). `is_anonymous` hanya menyembunyikan nama di papan
        publik — pelapor tetap tercatat untuk petugas desa.
      operationId: submitComplaint
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [category, title, description]
              properties:
                category: { type: string, example: "jalan_rusak" }
                title: { type: string, maxLength: 150 }
                description: { type: string, maxLength: 5000 }
                location: { type: string, nullable: true, maxLength: 255 }
                latitude: { type: number, format: float, nullable: true }
                longitude: { type: number, format: float, nullable: true }
                is_anonymous: { type: boolean, default: false }
                photos:
                  type: array
                  maxItems: 3
                  items: { type: string, format: binary }
                  description: "Kirim sebagai field berulang photos[]."
      responses:
        '201':
          description: Laporan berhasil dikirim
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data: { $ref: '#/components/schemas/ComplaintDetail' }
        '403':
          description: Akun belum terverifikasi / bukan warga
        '422':
          description: Validasi isian atau foto gagal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
        '429':
          description: Terlalu sering mengirim (throttle)

  /complaints/categories:
    get:
      tags: [Complaints]
      summary: Kategori baku pengaduan (dari config desa)
      operationId: complaintCategories
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Daftar kategori
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ComplaintCategory' }
        '401':
          description: Tidak terautentikasi

  /my-complaints:
    get:
      tags: [Complaints]
      summary: Daftar pengaduan milik warga yang login (terbaru dulu, paginasi 20)
      operationId: myComplaints
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Daftar ringkas pengaduan
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ComplaintSummary' }
                  meta:
                    type: object
                    properties:
                      total: { type: integer }
                      page: { type: integer }
        '401':
          description: Tidak terautentikasi

  /complaints/{complaint}:
    get:
      tags: [Complaints]
      summary: Detail satu pengaduan + foto bukti + kronologi
      description: Hanya pemilik atau petugas desa yang sama (Policy `Complaint@view`).
      operationId: complaintDetail
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ComplaintId' }]
      responses:
        '200':
          description: Data lengkap pengaduan
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ComplaintDetail' }
        '403':
          description: Bukan pemiliknya / lintas desa
        '404':
          description: Pengaduan tidak ditemukan

  /complaints/{complaint}/replies:
    post:
      tags: [Complaints]
      summary: Balasan pada pengaduan yang masih terbuka
      description: |
        Pemilik bisa membalas selama laporan belum selesai/ditolak; petugas desa yang sama
        selalu bisa. Perubahan status (diproses/selesai/ditolak) dilakukan staff via panel Filament.
      operationId: replyComplaint
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ComplaintId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, maxLength: 2000 }
      responses:
        '200':
          description: Balasan terkirim
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data: { $ref: '#/components/schemas/ComplaintDetail' }
        '403':
          description: Bukan pemiliknya / laporan sudah ditutup
        '422':
          description: Balasan kosong
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }

  /complaints/{complaint}/photos/{photo}:
    get:
      tags: [Complaints]
      summary: Unduh foto bukti (disk privat)
      description: Hanya untuk pihak yang boleh melihat pengaduan (pemilik / staff desa terkait).
      operationId: downloadComplaintPhoto
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/ComplaintId' }
        - name: photo
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Isi berkas foto
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '403':
          description: Tidak diizinkan melihat foto ini
        '404':
          description: Foto tidak ditemukan

  /pbb/cek-nop:
    get:
      tags: [Pbb, Public]
      summary: Cek NOP PBB (publik; nama wajib pajak disamarkan)
      description: |
        Tanpa login; di-rate-limit (config `desa.throttle.pbb_nop_check`) untuk mencegah
        scraping/penebakan NOP. NOP dinormalisasi ke digit saja (maks `desa.pbb.nop_max_len`).
        Mengembalikan objek pajak + ringkasan tagihan dengan `wp_name_masked` (bukan nama
        lengkap) dan `disclaimer` bahwa info bersifat sementara — pelunasan resmi mengikuti
        kantor pajak. 404 bila NOP tidak ditemukan di desa tsb.
      operationId: pbbCekNop
      parameters:
        - name: nop
          in: query
          required: true
          schema: { type: string, maxLength: 32 }
        - name: village_id
          in: query
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Data objek pajak + tagihan (nama disamarkan)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/PbbObjectLookup' }
        '404':
          description: NOP tidak ditemukan di desa ini
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '422':
          description: NOP / desa tidak valid
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
        '429':
          description: Terlalu banyak permintaan (throttle)

  /pbb/claims:
    post:
      tags: [Pbb]
      summary: "Ajukan klaim kepemilikan NOP (multipart: nop + bukti foto)"
      description: |
        Hanya warga berstatus `verified` (Policy `PbbClaim@create`). Bukti berupa satu gambar
        (SPPT/surat tanah) — MIME & ukuran dibatasi config `desa.pbb`. Klaim baru berstatus
        `pending` menunggu verifikasi operator di panel. Ditolak (422) bila NOP sudah atas nama
        pemohon (approved) atau klaim sebelumnya masih pending.
      operationId: pbbStoreClaim
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [nop, evidence]
              properties:
                nop: { type: string, maxLength: 32 }
                note: { type: string, nullable: true, maxLength: 1000 }
                evidence: { type: string, format: binary, description: "Foto bukti (JPG/PNG/WebP)." }
      responses:
        '201':
          description: Klaim terkirim, menunggu verifikasi desa
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data: { $ref: '#/components/schemas/PbbClaim' }
        '403':
          description: Akun belum terverifikasi / bukan warga
        '422':
          description: NOP tidak ditemukan / klaim ganda / validasi bukti gagal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }

  /my-pbb-objects:
    get:
      tags: [Pbb]
      summary: 'NOP saya — objek atas nama warga (klaim disetujui) + ringkasan tunggakan'
      operationId: pbbMyObjects
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Daftar NOP milik warga beserta tagihannya
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/PbbMyObject' }
        '401':
          description: Tidak terautentikasi

  /my-pbb-claims:
    get:
      tags: [Pbb]
      summary: Riwayat klaim NOP milik warga (terbaru dulu)
      operationId: pbbMyClaims
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Daftar klaim milik pemohon
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/PbbClaim' }
        '401':
          description: Tidak terautentikasi

  /pbb/claims/{claim}/evidence:
    get:
      tags: [Pbb]
      summary: Unduh foto bukti klaim (disk privat)
      description: Hanya untuk pemilik klaim atau peninjau desa terkait (Policy `PbbClaim@downloadEvidence`).
      operationId: pbbClaimEvidence
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/PbbClaimId' }]
      responses:
        '200':
          description: Isi berkas bukti
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '403':
          description: Tidak diizinkan melihat bukti ini
        '404':
          description: Bukti tidak ditemukan

  /pbb/bills:
    get:
      tags: [Pbb]
      summary: Tagihan dalam lingkup RT kolektor (untuk memilih NOP yang akan disetor)
      description: |
        Hanya RT/kolektor atau petugas desa (`abort_unless` selain itu 403). Ditandai scope `rt`
        kolektor (dari pivot role) bila ada; filter `year` opsional; maks 100 baris. Menampilkan
        `nop`, nama WP, dan status tagihan lengkap (bukan versi samaran — khusus petugas).
      operationId: pbbCollectorBills
      security: [{ bearerAuth: [] }]
      parameters:
        - name: year
          in: query
          required: false
          schema: { type: integer }
      responses:
        '200':
          description: Daftar tagihan lingkup kolektor
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    type: object
                    properties:
                      scope_rt: { type: string, nullable: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/PbbBillFull' }
        '403':
          description: Bukan RT/kolektor atau petugas desa
        '401':
          description: Tidak terautentikasi

  /pbb/deposits:
    post:
      tags: [Pbb]
      summary: "RT/kolektor mengajukan slip setoran (multipart: isian + foto slip opsional)"
      description: |
        Hanya kolektor terverifikasi (Policy `PbbDepositBatch@create`). Rate-limited (config
        `desa.throttle.pbb_deposit_submit`). Hanya menerima tagihan berstatus `belum_bayar`; tiap
        tagihan terpilih berpindah ke `disetor_pending` menunggu ACC bendahara di panel. ACC
        sebagian dilakukan per item oleh bendahara — bukan lewat API ini.
      operationId: pbbStoreDeposit
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [title, bills]
              properties:
                title: { type: string, maxLength: 150 }
                note: { type: string, nullable: true, maxLength: 1000 }
                bills:
                  type: array
                  minItems: 1
                  maxItems: 100
                  description: "Kirim sebagai field berulang bills[i][pbb_bill_id], bills[i][amount_claimed]."
                  items:
                    type: object
                    required: [pbb_bill_id]
                    properties:
                      pbb_bill_id: { type: integer }
                      amount_claimed: { type: number, nullable: true, minimum: 0 }
                evidence: { type: string, format: binary, nullable: true, description: "Foto slip setoran (opsional)." }
      responses:
        '201':
          description: Setoran tercatat, menunggu ACC bendahara
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data: { $ref: '#/components/schemas/PbbDepositBatch' }
        '403':
          description: Bukan kolektor terverifikasi
        '422':
          description: Validasi isian / tagihan gagal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
        '429':
          description: Terlalu sering mengirim (throttle)

  /my-pbb-deposits:
    get:
      tags: [Pbb]
      summary: Daftar slip setoran milik kolektor yang login (terbaru dulu)
      operationId: pbbMyDeposits
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Riwayat setoran kolektor
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/PbbDepositBatch' }
        '401':
          description: Tidak terautentikasi

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum

  parameters:
    LetterId:
      name: letter
      in: path
      required: true
      schema: { type: integer }
    ComplaintId:
      name: complaint
      in: path
      required: true
      schema: { type: integer }
    PbbClaimId:
      name: claim
      in: path
      required: true
      schema: { type: integer }

  schemas:
    User:
      type: object
      properties:
        id: { type: integer }
        village_id: { type: integer, nullable: true, description: "Semua data terikat desa (prinsip multi-desa)." }
        name: { type: string }
        phone: { type: string }
        email: { type: string, format: email, nullable: true, description: "Untuk akun perangkat desa/operator." }
        status: { type: string, enum: [pending, verified, rejected] }
        rt: { type: string, nullable: true }
        rw: { type: string, nullable: true }
        consent_given_at: { type: string, format: date-time, nullable: true }
        terms_version: { type: string, nullable: true }
        roles:
          type: array
          items: { $ref: '#/components/schemas/Role' }
    Role:
      type: object
      properties:
        name: { type: string, example: "admin" }
        label: { type: string, example: "Administrator Desa" }
    Message:
      type: object
      properties:
        message: { type: string }
    ValidationError:
      type: object
      properties:
        message: { type: string }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
    LetterField:
      type: object
      description: Satu field formulir dinamis dalam `form_schema_json` jenis surat.
      properties:
        key: { type: string, example: "nama_usaha" }
        label: { type: string, nullable: true }
        type: { type: string, enum: [text, textarea, select], example: text }
        required: { type: boolean }
        options:
          type: array
          items: { type: string }
          nullable: true
          description: Opsi untuk bertipe `select`.
    LetterType:
      type: object
      properties:
        id: { type: integer }
        code: { type: string, example: "sk-usaha" }
        name: { type: string, example: "Surat Keterangan Usaha" }
        needs_rt: { type: boolean, description: "Perlu pengantar RT/RW sebelum verifikasi operator." }
        form_schema_json:
          type: array
          items: { $ref: '#/components/schemas/LetterField' }
        required_attachments_json:
          type: array
          items: { type: string }
          nullable: true
          description: "Daftar nama lampiran wajib (mis. KTP, KK)."
    LetterSummary:
      type: object
      properties:
        id: { type: integer }
        type_name: { type: string }
        status: { type: string, enum: [diajukan, verifikasi_rt, verifikasi_operator, menunggu_ttd_kades, selesai, perlu_perbaikan, ditolak] }
        status_label: { type: string, example: "Menunggu tanda tangan kepala desa" }
        number: { type: string, nullable: true, description: "Nomor surat, terbit otomatis anti-duplikat saat selesai." }
        submitted_at: { type: string, format: date-time, nullable: true }
    LetterDetail:
      type: object
      properties:
        id: { type: integer }
        type:
          allOf: [{ $ref: '#/components/schemas/LetterType' }]
          nullable: true
        status: { type: string, enum: [diajukan, verifikasi_rt, verifikasi_operator, menunggu_ttd_kades, selesai, perlu_perbaikan, ditolak] }
        status_label: { type: string }
        number: { type: string, nullable: true }
        data:
          type: object
          additionalProperties: { type: string }
          description: "Isi formulir sesuai skema jenis surat."
        note: { type: string, nullable: true, description: "Catatan petugas terakhir (tolak/perbaikan)." }
        flagged_fields:
          type: array
          items: { type: string }
          description: "Kunci field yang ditandai petugas untuk diperbaiki (tampil merah di wizard)."
        editable: { type: boolean, description: "true hanya saat status perlu_perbaikan." }
        submitted_at: { type: string, format: date-time, nullable: true }
        completed_at: { type: string, format: date-time, nullable: true }
        attachments:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              name: { type: string }
              download_url: { type: string, example: "/api/letters/1/attachments/2" }
        history:
          type: array
          description: "Riwayat perpindahan status (audit, immutabel)."
          items:
            type: object
            properties:
              from: { type: string, nullable: true }
              to: { type: string }
              to_label: { type: string }
              note: { type: string, nullable: true }
              flagged:
                type: array
                items: { type: string }
                nullable: true
              at: { type: string, format: date-time, nullable: true }
    ComplaintCategory:
      type: object
      description: Satu kategori baku pengaduan dari config desa.
      properties:
        code: { type: string, example: "jalan_rusak" }
        label: { type: string, example: "Jalan Rusak" }
    ComplaintSummary:
      type: object
      properties:
        id: { type: integer }
        category_label: { type: string }
        title: { type: string }
        status: { type: string, enum: [diterima, diproses, selesai, ditolak] }
        status_label: { type: string, example: "Sedang diproses" }
        closed: { type: boolean, description: "true bila selesai/ditolak (percakapan ditutup)." }
        submitted_at: { type: string, format: date-time, nullable: true }
    ComplaintWallItem:
      type: object
      description: Entitas papan publik — identitas pelapor anonim sudah disamarkan server.
      properties:
        id: { type: integer }
        category_label: { type: string }
        title: { type: string }
        description: { type: string }
        location: { type: string, nullable: true }
        status: { type: string, enum: [diterima, diproses, selesai, ditolak] }
        status_label: { type: string }
        reporter_name: { type: string, example: "Warga anonim", description: "Nama pelapor, atau 'Warga anonim' bila laporan ditandai anonim." }
        submitted_at: { type: string, format: date-time, nullable: true }
        resolved_at: { type: string, format: date-time, nullable: true }
    ComplaintPhoto:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        download_url: { type: string, example: "/api/complaints/1/photos/2" }
    ComplaintTimelineEntry:
      type: object
      description: "Satu baris kronologi: balasan (to_status null) atau perubahan status (to_status terisi)."
      properties:
        id: { type: integer }
        body: { type: string, nullable: true }
        is_staff: { type: boolean, description: "true bila ditulis oleh petugas desa." }
        author: { type: string, description: "Nama penulis, atau 'Sistem'/'Petugas'." }
        to_status: { type: string, enum: [diterima, diproses, selesai, ditolak], nullable: true }
        to_label: { type: string, nullable: true }
        at: { type: string, format: date-time, nullable: true }
    ComplaintDetail:
      type: object
      properties:
        id: { type: integer }
        category: { type: string, example: "jalan_rusak" }
        category_label: { type: string }
        title: { type: string }
        description: { type: string }
        location: { type: string, nullable: true }
        latitude: { type: number, format: float, nullable: true }
        longitude: { type: number, format: float, nullable: true }
        status: { type: string, enum: [diterima, diproses, selesai, ditolak] }
        status_label: { type: string }
        is_anonymous: { type: boolean }
        reporter:
          type: object
          nullable: true
          description: "Identitas pelapor — selalu tampil untuk pemilik & petugas desa, walau laporan anonim."
          properties:
            id: { type: integer, nullable: true }
            name: { type: string, nullable: true }
        closed: { type: boolean }
        submitted_at: { type: string, format: date-time, nullable: true }
        resolved_at: { type: string, format: date-time, nullable: true }
        photos:
          type: array
          items: { $ref: '#/components/schemas/ComplaintPhoto' }
        timeline:
          type: array
          description: "Kronologi + balasan (audit, immutabel)."
          items: { $ref: '#/components/schemas/ComplaintTimelineEntry' }
    PbbBillLookup:
      type: object
      description: "Ringkasan tagihan utk cek NOP publik (id tagihan & tahun; tanpa data pribadi tambahan)."
      properties:
        id: { type: integer }
        year: { type: integer, example: 2026 }
        amount: { type: number, description: "P PBB (rupiah)." }
        penalty: { type: number, description: "Denda / bunga (rupiah)." }
        total: { type: number, description: "amount + penalty." }
        status: { type: string, enum: [belum_bayar, disetor_pending, lunas] }
        status_label: { type: string, example: "Belum bayar" }
        is_arrears: { type: boolean, description: "true bila belum lunas." }
        due_date: { type: string, format: date, nullable: true }
    PbbBillFull:
      type: object
      description: "Tagihan penuh utk petugas/kolektor — menyertakan NOP & nama WP (tidak disamarkan)."
      allOf:
        - { $ref: '#/components/schemas/PbbBillLookup' }
      properties:
        nop: { type: string }
        wp_name: { type: string }
        rt: { type: string, nullable: true }
    PbbObjectLookup:
      type: object
      description: "Hasil cek NOP — nama wajib pajak sengaja disamarkan demi perlindungan data pribadi."
      properties:
        nop: { type: string, example: "123456789012345678" }
        wp_name_masked: { type: string, example: "B*** S*****", description: "Nama WP disamarkan (huruf awal tiap kata)." }
        address: { type: string, nullable: true }
        rt: { type: string, nullable: true }
        rw: { type: string, nullable: true }
        land_area: { type: number, nullable: true, description: "m2 tanah." }
        building_area: { type: number, nullable: true, description: "m2 bangunan." }
        arrears_count: { type: integer, description: "Jumlah tahun yang masih tunggakan." }
        arrears_total: { type: number, description: "Total tunggakan (pokok + denda)." }
        bills:
          type: array
          items: { $ref: '#/components/schemas/PbbBillLookup' }
        disclaimer: { type: string, description: "Catatan bahwa info sementara & pelunasan resmi mengikuti kantor pajak." }
    PbbMyObject:
      type: object
      description: "NOP milik warga (klaim disetujui) — data lengkap, termasuk nama WP asli."
      properties:
        id: { type: integer }
        nop: { type: string }
        wp_name: { type: string }
        address: { type: string, nullable: true }
        rt: { type: string, nullable: true }
        rw: { type: string, nullable: true }
        arrears_count: { type: integer }
        arrears_total: { type: number }
        bills:
          type: array
          items: { $ref: '#/components/schemas/PbbBillFull' }
    PbbClaim:
      type: object
      description: "Klaim kepemilikan NOP oleh warga; dinilai operator di panel Filament."
      properties:
        id: { type: integer }
        nop: { type: string }
        wp_name: { type: string, nullable: true }
        address: { type: string, nullable: true }
        status: { type: string, enum: [pending, approved, rejected] }
        status_label: { type: string, example: "Menunggu verifikasi" }
        note: { type: string, nullable: true, description: "Catatan pemohon." }
        review_note: { type: string, nullable: true, description: "Alasan/hasil dari peninjau." }
        has_evidence: { type: boolean }
        evidence_url: { type: string, nullable: true, example: "/api/pbb/claims/1/evidence" }
        reviewed_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time, nullable: true }
    PbbDepositItem:
      type: object
      description: "Satu tagihan dalam slip setoran; ACC sebagian dilakukan bendahara per item."
      properties:
        id: { type: integer }
        nop: { type: string, nullable: true }
        year: { type: integer, nullable: true }
        amount_claimed: { type: number }
        bill_total: { type: number, nullable: true }
        status: { type: string, enum: [pending, approved, rejected] }
        status_label: { type: string }
        review_note: { type: string, nullable: true }
    PbbDepositBatch:
      type: object
      description: "Slip setoran RT/kolektor. Status berasal dari agregasi item (pending/sebagian/disetujui/ditolak)."
      properties:
        id: { type: integer }
        title: { type: string, example: "Setoran RT 03" }
        total_amount: { type: number }
        item_count: { type: integer }
        status: { type: string, enum: [pending, partially_approved, approved, rejected] }
        status_label: { type: string, example: "Menunggu ACC bendahara" }
        note: { type: string, nullable: true }
        reviewed_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time, nullable: true }
        items:
          type: array
          items: { $ref: '#/components/schemas/PbbDepositItem' }
